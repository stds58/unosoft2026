[defaults]
host_key_checking = False
stdout_callback = yaml
interpreter_python = /usr/bin/python3
pipelining = True
ssh_args = -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3
timeout = 60
retries = 3

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_flags = '-E'