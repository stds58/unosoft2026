- name: Configure Cassandra Nodes (Docker + Cluster)
  hosts: cassandra
  become: yes
  gather_facts: yes
  roles:
    #- role: docker
    - role: cassandra-cluster

- name: Configure Routes on Bastion for Cassandra Containers
  hosts: bastion
  become: yes
  tasks:
    - name: Add static routes to Cassandra containers via Machine A
      ansible.builtin.shell: |
        ip route add 192.168.1.200 via 192.168.1.197
        ip route add 192.168.1.201 via 192.168.1.197
        ip route add 192.168.1.202 via 192.168.1.197
      ignore_errors: true
