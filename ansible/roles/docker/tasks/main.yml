---
- name: Test proxy connectivity
  ansible.builtin.command: curl -s --connect-timeout 5 -I http://{{ bastion_ip }}:{{ proxy_port }}
  changed_when: false
  register: proxy_test
  failed_when: proxy_test.rc != 0

- name: Force IPv4 for APT and disable PDiffs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-ipv4
    content: |
      Acquire::ForceIPv4 "true";
      Acquire::PDiffs "false";
      Acquire::http::Timeout "120";
      Acquire::https::Timeout "120";
      Acquire::Retries "3";
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"

- name: Add Docker repository to Apt sources
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"

- name: Install Docker Engine and Plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: no
    lock_timeout: 120
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"
  register: docker_result
  until: docker_result is succeeded

- name: Ensure Docker systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'
  become: true

- name: Configure Docker proxy
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    content: |
      [Service]
      Environment="HTTP_PROXY=http://{{ bastion_ip }}:{{ proxy_port }}"
      Environment="HTTPS_PROXY=http://{{ bastion_ip }}:{{ proxy_port }}"
      Environment="NO_PROXY=localhost,127.0.0.1,.local,192.168.1.0/24"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart Docker

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
  become: true
  notify: Restart Docker

- name: Force restart Docker to apply proxy settings
  ansible.builtin.service:
    name: docker
    state: restarted
  become: true

- name: Wait for Docker to be ready after restart
  ansible.builtin.wait_for:
    timeout: 10
  become: true

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Show Docker version
  ansible.builtin.debug:
    var: docker_version.stdout