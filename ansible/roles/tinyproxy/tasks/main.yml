---
- name: Install Tinyproxy
  ansible.builtin.apt:
    name: tinyproxy
    state: present
    update_cache: yes
  retries: 3
  delay: 5

- name: Stop Tinyproxy service
  ansible.builtin.service:
    name: tinyproxy
    state: stopped
  failed_when: false

- name: Disable Tinyproxy service
  ansible.builtin.service:
    name: tinyproxy
    enabled: no
  failed_when: false

- name: Kill any existing tinyproxy processes
  ansible.builtin.command: pkill -9 tinyproxy
  changed_when: false
  failed_when: false

- name: Remove stale PID file
  ansible.builtin.file:
    path: /var/run/tinyproxy/tinyproxy.pid
    state: absent
  failed_when: false

- name: Ensure log directory exists with correct permissions
  ansible.builtin.file:
    path: /var/log/tinyproxy
    state: directory
    owner: tinyproxy
    group: tinyproxy
    mode: '0755'

- name: Ensure run directory exists
  ansible.builtin.file:
    path: /var/run/tinyproxy
    state: directory
    owner: tinyproxy
    group: tinyproxy
    mode: '0755'

- name: Write tinyproxy configuration (Port 3128)
  ansible.builtin.copy:
    content: |
      Port 3128
      Listen 0.0.0.0
      Timeout 600
      LogFile "/var/log/tinyproxy/tinyproxy.log"
      LogLevel Info
      PidFile "/var/run/tinyproxy/tinyproxy.pid"
      MaxClients 100
      MinSpareServers 5
      MaxSpareServers 20
      StartServers 10
      Allow 192.168.1.0/24
      ConnectPort 443
      ConnectPort 80
      ConnectPort 53
      ConnectPort 9042
      ConnectPort 9043
      ConnectPort 9044
      ConnectPort 7000
      ConnectPort 7001
      ConnectPort 7199
    dest: /etc/tinyproxy/tinyproxy.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Restart Tinyproxy

- name: Disable UFW firewall
  ansible.builtin.command: ufw disable
  args:
    warn: false
  changed_when: false
  failed_when: false

- name: Start Tinyproxy service
  ansible.builtin.service:
    name: tinyproxy
    state: started
    enabled: yes

- name: Wait for Tinyproxy to be ready
  ansible.builtin.wait_for:
    port: 3128
    host: "0.0.0.0"
    timeout: 30
    msg: "Tinyproxy failed to start listening on port 3128"

- name: Verify Tinyproxy is listening
  ansible.builtin.shell: ss -tlnp | grep 3128
  register: check_result
  changed_when: false
  failed_when: false

- name: Show Tinyproxy status
  ansible.builtin.debug:
    msg: "Tinyproxy is running: {{ check_result.stdout }}"
