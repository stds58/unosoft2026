- name: Start Tinyproxy service
  ansible.builtin.service:
    name: tinyproxy
    state: started
    enabled: yes
  #become: true

#- name: Start Tinyproxy manually (not via systemd)
#  ansible.builtin.command: nohup tinyproxy -c /etc/tinyproxy/tinyproxy.conf > /dev/null 2>&1 &
#  changed_when: false

- name: Wait for Tinyproxy to be ready
  ansible.builtin.wait_for:
    port: 3128
    host: "0.0.0.0"
    timeout: 30
    msg: "Tinyproxy failed to start listening on port 3128"
  #become: true

- name: Verify Tinyproxy is listening
  ansible.builtin.shell: ss -tlnp | grep 3128
  register: check_result
  changed_when: false
  failed_when: false

- name: Show Tinyproxy status
  ansible.builtin.debug:
    msg: "Tinyproxy is running: {{ check_result.stdout }}"
