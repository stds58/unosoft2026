---
- name: Install Tinyproxy
  ansible.builtin.apt:
    name: tinyproxy
    state: present
    update_cache: yes
  retries: 3
  delay: 5
  #become: true

- name: Stop Tinyproxy service
  ansible.builtin.service:
    name: tinyproxy
    state: stopped
  #become: true
  failed_when: false

- name: Disable Tinyproxy service
  ansible.builtin.service:
    name: tinyproxy
    enabled: no
  #become: true
  failed_when: false

- name: Kill any existing tinyproxy processes
  ansible.builtin.command: pkill -9 tinyproxy
  changed_when: false
  failed_when: false

- name: Remove stale PID file
  ansible.builtin.file:
    path: /var/run/tinyproxy/tinyproxy.pid
    state: absent
  #become: true
  failed_when: false

- name: Ensure log directory exists with correct permissions
  ansible.builtin.file:
    path: /var/log/tinyproxy
    state: directory
    owner: tinyproxy
    group: tinyproxy
    mode: '0755'

## Создаем папку для PID файла
#- name: Ensure run directory exists
#  ansible.builtin.file:
#    path: /var/run/tinyproxy
#    state: directory
#    owner: tinyproxy
#    group: tinyproxy
#    mode: '0755'
#  ignore_errors: yes
- name: Ensure run directory exists
  ansible.builtin.file:
    path: /var/run/tinyproxy
    state: directory
    owner: tinyproxy
    group: tinyproxy
    mode: '0755'

- name: Write tinyproxy configuration (Port 3128)
  ansible.builtin.copy:
    content: |
      Port 3128
      Listen 0.0.0.0
      Timeout 600
      LogFile "/var/log/tinyproxy/tinyproxy.log"
      LogLevel Info
      PidFile "/var/run/tinyproxy/tinyproxy.pid"
      MaxClients 100
      MinSpareServers 5
      MaxSpareServers 20
      StartServers 10
      Allow 192.168.1.0/24
      ConnectPort 443
      ConnectPort 80
      ConnectPort 53
      ConnectPort 9042
      ConnectPort 9043
      ConnectPort 9044
      ConnectPort 7000
      ConnectPort 7001
      ConnectPort 7199
    dest: /etc/tinyproxy/tinyproxy.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  #become: true
  notify: Restart Tinyproxy

#- name: Validate tinyproxy configuration
#  ansible.builtin.command: tinyproxy -c /etc/tinyproxy.conf
#  register: config_check
#  changed_when: false
#  failed_when: false
#
# Отключаем UFW
- name: Disable UFW firewall
  ansible.builtin.command: ufw disable
  args:
    warn: false
  changed_when: false
  failed_when: false
#
## Очищаем старый PID файл (частая причина проблем)
#- name: Remove stale PID file
#  ansible.builtin.file:
#    path: /var/run/tinyproxy/tinyproxy.pid
#    state: absent
