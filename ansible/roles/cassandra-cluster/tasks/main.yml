---
- name: Ensure project directory exists
  ansible.builtin.file:
    path: /opt/cassandra-cluster
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy Dockerfile to VM
  ansible.builtin.copy:
    src: Dockerfile
    dest: /opt/cassandra-cluster/Dockerfile
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Copy entrypoint.sh to VM
  ansible.builtin.copy:
    src: entrypoint.sh
    dest: /opt/cassandra-cluster/entrypoint.sh
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy sshd_config to VM
  ansible.builtin.copy:
    src: sshd_config
    dest: /opt/cassandra-cluster/sshd_config
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Copy Public SSH Key for containers
  ansible.builtin.copy:
    src: "/home/valar/.ssh/bastion_to_cluster_key.pub"
    dest: /opt/cassandra-cluster/bastion_to_cluster_key.pub
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Create .env file
  ansible.builtin.template:
    src: .env.j2
    dest: /opt/cassandra-cluster/.env
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Detect Network Interface
  ansible.builtin.set_fact:
    docker_parent_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"

- name: Create docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/cassandra-cluster/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Build and Start Cassandra Cluster
  ansible.builtin.shell: >
    docker compose build
    --build-arg HTTP_PROXY=http://{{ bastion_ip }}:{{ proxy_port }}
    --build-arg HTTPS_PROXY=http://{{ bastion_ip }}:{{ proxy_port }}
    --build-arg NO_PROXY=localhost,127.0.0.1,192.168.1.0/24
    && docker compose up -d --force-recreate
  args:
    chdir: /opt/cassandra-cluster
  register: compose_up
  retries: 5
  delay: 10
  until: compose_up.rc == 0
  environment:
    HTTP_PROXY: "http://{{ bastion_ip }}:{{ proxy_port }}"
    HTTPS_PROXY: "http://{{ bastion_ip }}:{{ proxy_port }}"
    NO_PROXY: "localhost,127.0.0.1,192.168.1.0/24"

- name: Wait for containers to initialize
  ansible.builtin.pause:
    seconds: 15

- name: Ensure IP Forwarding is enabled
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_set: yes

- name: Setup DNAT for ALL Cassandra Nodes (Static IP Mapping)
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    destination: "{{ item.dest_ip }}"
    protocol: tcp
    destination_port: 9042
    jump: DNAT
    to_destination: "{{ item.target_ip }}:9042"
    comment: "Redirect traffic for {{ item.node_name }}"
  loop:
    - {
        dest_ip: '{{ cassandra_nodes[0].container_ip }}',
        target_ip: '{{ cassandra_nodes[0].internal_ip }}',
        ssh_external_port: 2200,
        node_name: '{{ cassandra_nodes[0].name }}'
      }
    - {
        dest_ip: '{{ cassandra_nodes[1].container_ip }}',
        target_ip: '{{ cassandra_nodes[1].internal_ip }}',
        ssh_external_port: 2201,
        node_name: '{{ cassandra_nodes[1].name }}'
      }
    - {
        dest_ip: '{{ cassandra_nodes[2].container_ip }}',
        target_ip: '{{ cassandra_nodes[2].internal_ip }}',
        ssh_external_port: 2202,
        node_name: '{{ cassandra_nodes[2].name }}'
      }

- name: Allow forwarding to Cassandra Docker Network
  ansible.builtin.iptables:
    chain: FORWARD
    destination: "172.20.0.0/24"
    jump: ACCEPT
    comment: "Allow traffic to Cassandra containers"

- name: Allow SSH forwarding to Cassandra Docker Network
  ansible.builtin.iptables:
    chain: FORWARD
    destination: "172.20.0.0/24"
    protocol: tcp
    destination_port: 22
    jump: ACCEPT
    comment: "Allow SSH to Cassandra containers"

- name: Allow forwarding from Cassandra Docker Network
  ansible.builtin.iptables:
    chain: FORWARD
    source: "172.20.0.0/24"
    jump: ACCEPT
    comment: "Allow traffic from Cassandra containers"

- name: Enable Masquerade for Cassandra Docker Network
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "172.20.0.0/24"
    jump: MASQUERADE
    comment: "Masquerade outbound traffic from containers"

- name: Allow INPUT to Cassandra Docker Network
  ansible.builtin.iptables:
    chain: INPUT
    destination: "172.20.0.0/24"
    protocol: tcp
    destination_port: 9042
    jump: ACCEPT
    rule_num: 1
    comment: "Allow incoming Cassandra traffic to Docker network"

- name: Allow DOCKER-USER for Cassandra
  ansible.builtin.iptables:
    chain: DOCKER-USER
    destination: "172.20.0.0/24"
    protocol: tcp
    destination_port: 9042
    jump: ACCEPT
    rule_num: 1
    comment: "Allow Docker to forward Cassandra traffic (dest)"

- name: Allow DOCKER-USER for Cassandra (source)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    source: "172.20.0.0/24"
    protocol: tcp
    source_port: 9042
    jump: ACCEPT
    rule_num: 2
    comment: "Allow Docker to forward Cassandra traffic (src)"

- name: Ensure iptables directory exists
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Save iptables rules to persistent file
  ansible.builtin.shell: |
    iptables-save > /etc/iptables/rules.v4
    ip6tables-save > /etc/iptables/rules.v6
  args:
    creates: /etc/iptables/rules.v4

- name: Ensure iptables rules are restored on boot
  ansible.builtin.copy:
    dest: /etc/network/if-pre-up.d/iptables-restore
    content: |
      #!/bin/sh
      /sbin/iptables-restore < /etc/iptables/rules.v4
      /sbin/ip6tables-restore < /etc/iptables/rules.v6
    owner: root
    group: root
    mode: '0755'

- name: Save iptables rules
  ansible.builtin.shell: |
    iptables-save > /etc/iptables/rules.v4
    ip6tables-save > /etc/iptables/rules.v6
